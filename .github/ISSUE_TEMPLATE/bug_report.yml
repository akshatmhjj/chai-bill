name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Please don't include real names, amounts or credentials.** Use made-up data in descriptions and screenshots.
        If this is a security problem (for example seeing someone else's data), please report it privately instead. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Sign in as two roommates
        2. Add an expense of ₹100.01 split equally
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Sign-in or onboarding
        - Expenses
        - Settle up or payments
        - Shopping list
        - Activity feed or live updates
        - Profile, avatars or theme
        - Layout on a particular screen size
        - Database or security rules
        - Something else
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "e.g. iPhone 14, Safari 18, or Chrome 130 on macOS"
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: ["Light", "Dark", "Not sure or doesn't matter"]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images in here. Blur anything that looks real.
